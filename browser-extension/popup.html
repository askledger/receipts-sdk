<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Ledger</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #0a1530; color: #eef1fa; font-size: 13px; }
header { padding: 14px 16px; border-bottom: 1px solid rgba(232,200,120,.12); display: flex; align-items: center; justify-content: space-between; }
header .brand { display: flex; gap: 8px; align-items: center; font-weight: 700; }
header .mark { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, #c79b3c, #e8c878); position: relative; }
header .mark::after { content:""; position:absolute; inset:3px; border-radius:2px; background: #0a1530; }
header .mark::before { content:""; position:absolute; left:5px; right:5px; top:8px; height:2px; background:#e8c878; z-index:2; }
header .pubkey { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; color: #a8b1cf; }
.stats { padding: 14px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-bottom: 1px solid rgba(232,200,120,.12); }
.stat { background: rgba(255,255,255,.03); border: 1px solid rgba(232,200,120,.12); border-radius: 6px; padding: 8px 10px; text-align: left; }
.stat .num { font-size: 18px; font-weight: 800; color: #e8c878; }
.stat .lbl { font-size: 10px; color: #a8b1cf; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.list { max-height: 280px; overflow-y: auto; padding: 4px 8px 14px; }
.entry { padding: 10px 8px; border-bottom: 1px dashed rgba(232,200,120,.08); }
.entry:last-child { border: none; }
.entry .row1 { display: flex; justify-content: space-between; align-items: center; }
.entry .vendor { font-weight: 700; font-size: 12px; color: #e8c878; }
.entry .when { font-size: 10px; color: #a8b1cf; }
.entry .hash { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; color: #4dd0a0; margin-top: 4px; }
.empty { padding: 30px 16px; text-align: center; color: #8a93b6; font-style: italic; font-size: 12px; }
footer { padding: 12px 16px; border-top: 1px solid rgba(232,200,120,.12); display: flex; justify-content: space-between; gap: 8px; }
button { font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(232,200,120,.28); background: transparent; color: #eef1fa; cursor: pointer; }
button:hover { background: rgba(232,200,120,.08); }
button.primary { background: #c79b3c; color: #0a1530; border-color: #c79b3c; font-weight: 700; }
button.danger { color: #ff6b6b; border-color: rgba(255,107,107,.4); }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark"></div><span>Project Ledger</span></div>
  <span class="pubkey" id="pubkey">loading…</span>
</header>
<section class="stats">
  <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Receipts</div></div>
  <div class="stat"><div class="num" id="todayCount">0</div><div class="lbl">Today</div></div>
  <div class="stat"><div class="num" id="vendorCount">0</div><div class="lbl">Vendors</div></div>
</section>
<section class="list" id="list">
  <div class="empty">No receipts yet. Open ChatGPT, Claude, or Gemini and ask anything.</div>
</section>
<footer>
  <button id="exportBtn">Export JSON</button>
  <button id="clearBtn" class="danger">Clear</button>
  <button id="optionsBtn" class="primary">Settings</button>
</footer>
<script src="popup.js" type="module"></script>
</body>
</html>
