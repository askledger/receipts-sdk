[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askledger-receipts"
version = "0.1.0"
description = "Cryptographic AI Decision Receipts — wire-format compatible Python SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rashed Ali Khan" },
  { name = "Mahamed Arif" }
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/askledger/receipts-sdk"
Spec = "https://github.com/askledger/receipts-sdk/blob/main/docs/RECEIPTS_PROTOCOL.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
