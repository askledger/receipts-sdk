[package]
name = "askledger-receipts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cryptographic AI Decision Receipts — wire-format compatible Rust SDK"
authors = ["Rashed Ali Khan", "Mahamed Arif"]
repository = "https://github.com/askledger/receipts-sdk"
keywords = ["ai", "receipts", "rfc-8785", "ed25519", "audit"]
categories = ["cryptography"]

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1.10", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
