# Prometheus alerting rules · AskLedger
#
# Every alert here has a corresponding runbook entry in
# docs/operations/RUNBOOK.md. CI verifies the link via
# tools/verify-alerts-have-runbooks.ts.
#
# Severity convention:
#   - critical = page on-call immediately (P0/P1)
#   - warning  = ticket within 4h
#   - info     = trend signal, no page
#
# Naming: pl_<service>_<noun>_<adjective>
# Labels: every alert MUST set severity, service, runbook_url.

groups:
  - name: pl_signer
    interval: 30s
    rules:
      - alert: SignerLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(pl_signer_sign_duration_ms_bucket[5m]))) > 100
        for: 5m
        labels:
          severity: warning
          service: signer
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md#31-signersigning_latency_p95_high
        annotations:
          summary: "Signer p95 latency > 100ms"
          description: "Signing latency p95 is {{ $value }}ms. Check KMS throttling and HSM pool."

      - alert: SignerLatencyP95Critical
        expr: histogram_quantile(0.95, sum by (le) (rate(pl_signer_sign_duration_ms_bucket[5m]))) > 250
        for: 10m
        labels:
          severity: critical
          service: signer
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md#31-signersigning_latency_p95_high
        annotations:
          summary: "Signer p95 latency > 250ms — PAGE"
          description: "Sustained p95 > 250ms means active customer impact."

  - name: pl_chain
    interval: 30s
    rules:
      - alert: ChainWriteFailureRateHigh
        expr: rate(pl_chain_write_errors_total[5m]) / rate(pl_chain_write_attempts_total[5m]) > 0.005
        for: 5m
        labels:
          severity: critical
          service: chain-store
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md#32-chainwrite_failure_rate_high
        annotations:
          summary: "Chain write failure rate > 0.5%"
          description: "Failures: {{ $value | humanizePercentage }}. Check Postgres + disk + uniqueness race."

  - name: pl_tlog
    interval: 30s
    rules:
      - alert: TlogSthPublishDelayed
        expr: time() - pl_tlog_last_sth_timestamp_seconds > 300
        for: 1m
        labels:
          severity: critical
          service: tlog
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md#33-tlogsth_publish_delayed
        annotations:
          summary: "Transparency log STH not published for > 5min"
          description: "Last STH: {{ $value }}s ago. Trillian may be electing."

  - name: pl_extension
    interval: 30s
    rules:
      - alert: ExtensionIdentityBindingFailuresHigh
        expr: rate(pl_extension_identity_failures_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          service: extension-relay
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md#34-extensionidentity_binding_failures_high
        annotations:
          summary: "Browser extension identity binding failure rate > 1%"
          description: "Could be tenant OIDC outage or extension update bug."

  - name: pl_security
    interval: 10s
    rules:
      - alert: CrossTenantQueryDetected
        expr: increase(pl_tenant_cross_tenant_attempts_total[1m]) > 0
        for: 0m   # PAGE IMMEDIATELY — no debounce
        labels:
          severity: critical
          service: api-gateway
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md#35-tenantcross_tenant_query_detected
        annotations:
          summary: "P0 — cross-tenant query attempt detected"
          description: "Page CTO + Security on-call. {{ $value }} attempts in last 1m. Capture forensic snapshot."

  - name: pl_console_health
    interval: 30s
    rules:
      - alert: ConsoleReadinessFailing
        expr: pl_console_ready == 0
        for: 2m
        labels:
          severity: critical
          service: console-web
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/operations/RUNBOOK.md
        annotations:
          summary: "Console readiness probe failing for > 2min"
          description: "A pod cannot serve requests. Check downstream deps."

  - name: pl_supply_chain
    interval: 1h
    rules:
      - alert: HighSeverityVulnInDeps
        expr: pl_dependency_vuln_count{severity="high"} > 0 or pl_dependency_vuln_count{severity="critical"} > 0
        for: 0m
        labels:
          severity: warning
          service: supply-chain
          runbook_url: https://github.com/askledger/receipts-sdk/blob/main/docs/security/HARDENING_CHECKLIST.md#g--supply-chain-mandatory
        annotations:
          summary: "High/critical vuln in dependencies"
          description: "{{ $value }} dependencies with high/critical CVEs."
