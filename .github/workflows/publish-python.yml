name: Publish Python SDK to PyPI

# Triggers on a tag like `python-v0.1.0` (kept separate from the `v*` npm release).
# Requires repo secret: PYPI_API_TOKEN  (a PyPI API token, value starts with "pypi-")
# See PUBLISHING.md for setup.

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build + publish askledger-receipts to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
