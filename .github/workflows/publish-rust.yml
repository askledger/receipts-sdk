name: Publish Rust SDK to crates.io

# Triggers on a tag like `rust-v0.1.0`.
# Requires repo secret: CARGO_REGISTRY_TOKEN  (a crates.io API token)
# See PUBLISHING.md for setup.

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build + publish askledger-receipts to crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Verify package (dry run)
        run: cargo publish --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
