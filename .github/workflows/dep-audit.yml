# Active vulnerability scanning for the non-npm SDKs (npm is covered by
# security-scan.yml's `npm audit`). Runs on PRs that touch each SDK, on pushes
# to main, and weekly so newly-disclosed advisories surface even without a change.
name: Dependency audit (Rust/Python/Go)

on:
  push:
    branches: [main]
    paths: ["rust-sdk/**", "python-sdk/**", "go-sdk/**", ".github/workflows/dep-audit.yml"]
  pull_request:
    branches: [main]
    paths: ["rust-sdk/**", "python-sdk/**", "go-sdk/**", ".github/workflows/dep-audit.yml"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo-audit (rust-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - working-directory: rust-sdk
        run: cargo audit

  pip-audit:
    name: pip-audit (python-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: python-sdk/requirements.lock

  govulncheck:
    name: govulncheck (go-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: go-sdk
          # Analyze with the latest patched Go so stdlib advisories (govulncheck
          # reports reachable ones, e.g. GO-2025-3750 in os) are evaluated against
          # a fixed toolchain. go-sdk only requires go 1.22 as a floor.
          go-version-input: "stable"
