name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  preflight:
    name: Preflight — build + test gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "20", cache: npm }
      - run: npm ci || npm install
      - name: TS build
        run: npm run build
      - name: Tests
        run: npm test

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      # OIDC "trusted publishing" (no long-lived token) requires npm >= 11.5.0.
      # setup-node@v6 ships npm 10 with Node 20, so upgrade before publishing.
      # Pin to npm 11 (not @latest): npm 12 dropped Node 20 support, and this
      # job runs on Node 20. npm 11 supports both Node 20 and OIDC publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11
      - name: Publish with provenance (OIDC trusted publishing)
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub release with notes
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "20", cache: npm }
      - run: npm ci && npm run build
      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs > sbom.cyclonedx.json
      # Attach the packed npm tarball (one file), not the raw dist/ tree. GitHub
      # release assets share a flat namespace, so dist/**/* collides on duplicate
      # basenames (many index.d.ts / index.js) and fails the asset upload.
      - name: Pack tarball
        run: npm pack
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            sbom.cyclonedx.json
            *.tgz
