name: HSM nightly integration

on:
  # The nightly schedule is disabled until cloud-KMS test credentials
  # (AWS_KMS_TEST_ROLE_ARN, Azure, GCP) are configured as repo secrets — it was
  # failing every night on the missing secrets. Run it on demand from the
  # Actions tab once those are set.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-kms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_KMS_TEST_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx vitest run test/hsm-integration.test.ts
        env:
          PL_AWS_KMS_KEY_ARN: ${{ secrets.AWS_KMS_TEST_KEY_ARN }}

  azure-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_KV_TEST_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx vitest run test/hsm-integration.test.ts
        env:
          PL_AZURE_KEY_URI: ${{ secrets.AZURE_KV_TEST_KEY_URI }}

  gcp-kms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_KMS_TEST_SA }}
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx vitest run test/hsm-integration.test.ts
        env:
          PL_GCP_KMS_KEY: ${{ secrets.GCP_KMS_TEST_KEY }}

  softhsm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SoftHSM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y softhsm2 opensc
          mkdir -p $HOME/.softhsm/tokens
          export SOFTHSM2_CONF=$HOME/.softhsm/softhsm2.conf
          echo "directories.tokendir = $HOME/.softhsm/tokens" > $SOFTHSM2_CONF
          softhsm2-util --init-token --slot 0 --label pl-test --pin 1234 --so-pin 1234
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx vitest run test/hsm-integration.test.ts
        env:
          SOFTHSM2_CONF: ${{ env.HOME }}/.softhsm/softhsm2.conf
          PL_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
          PL_PKCS11_PIN: "1234"
          PL_PKCS11_LABEL: pl-test
