name: Security scan

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays at 06:00 UTC — catches new CVEs in pinned deps.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  id-token: write   # required for keyless cosign / SLSA provenance

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, go, java]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # No-build extraction for every language: the compiled ones (go, java)
          # otherwise autobuild and fail here (no Maven/Go build step). CodeQL
          # 'none' mode analyzes source without compiling.
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  trivy:
    name: Trivy filesystem + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"

  hardening-checklist:
    name: Hardening checklist verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npx tsx tools/verify-hardening.ts

  sbom:
    name: Generate + attest CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: [npm-audit, trivy]
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: sigstore/cosign-installer@v3
      - name: Cosign attest SBOM (keyless)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  slsa-provenance:
    name: SLSA Level 3 provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: sbom
    # The SLSA reusable workflow requires these caller permissions; without an
    # explicit job-level block it inherits the top-level `contents: read`, which
    # is insufficient and made the ENTIRE workflow invalid at startup (so none
    # of the scans above ran on push/PR).
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.sbom.outputs.hashes }}
