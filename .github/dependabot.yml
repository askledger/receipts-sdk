# Dependabot version updates. Batched into ONE grouped PR per ecosystem per week
# to avoid PR floods, with a low open-PR cap. Crypto/canonicalization libraries
# are pinned against MAJOR bumps — those change signature/hash bytes and must go
# through the cross-language conformance suite + a security review, never an
# auto-PR. (Security advisories are still surfaced separately by the repo's
# Dependabot alerts + the dep-audit workflow.)
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/console"
      - "/conformance"
      - "/integrations/claude-code"
      - "/integrations/cursor"
      - "/integrations/openai-proxy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
    # Minor/patch only. Major bumps (crypto especially) change behavior and are
    # done deliberately with the conformance suite, never an auto-PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/rust-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: "/python-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: "/go-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: maven
    directory: "/java-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      maven:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/deploy"
      - "/console"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
