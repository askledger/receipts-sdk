{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "project-ledger.fullname" . }}
spec:
  podSelector:
    matchLabels: {{- include "project-ledger.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 3000 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: data }
      ports: [{ port: 5432 }]    # postgres
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: data }
      ports: [{ port: 8091 }]    # trillian gateway
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 4317 }]    # otel collector
    - to: [{ namespaceSelector: {} }]
      ports: [{ port: 53, protocol: UDP }]
{{- end }}
