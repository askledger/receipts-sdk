image:
  repository: ghcr.io/projectledger/console
  tag: "0.6.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: 1000m, memory: 1Gi }

podDisruptionBudget:
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }

networkPolicy:
  enabled: true

postgres:
  url: ""           # set via existingSecret in production
  existingSecret: pl-postgres-dsn

trillian:
  url: "http://trillian-log-server:8091"

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s

prometheusRule:
  enabled: true

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: console.projectledger.io
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - hosts: [console.projectledger.io]
      secretName: console-tls

env:
  PL_USE_FIXTURES: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc:4317"
